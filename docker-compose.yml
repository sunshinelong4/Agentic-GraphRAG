services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=https://api.deepseek.com
      - DEFAULT_MODEL=deepseek-chat
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-v4}
      - MINERU_API_KEY=${MINERU_API_KEY:-}
      - AUTH_ENABLED=true
      - DEBUG=false
      - AUTH_DB_PATH=/app/data/auth.sqlite3
      - GRAPH_PERSIST_PATH=/app/data/graph.json
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - CACHE_DIR=/app/data/cache
      # Backend is private; nginx is the only network ingress and overwrites forwarded headers.
      - FORWARDED_ALLOW_IPS=*
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
